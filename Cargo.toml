[package]
name = "double-pendulum-classifier"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/auroral-cat/double-pendulum-classifier"
rust-version = "1.97.1"

[dependencies]
color-eyre = "0.6.5" # my beloved

[dev-dependencies]
# peroxide 0.43's uses anyhow internally, so this is required.
anyhow = "1"
criterion = "0.8"
diffsol = { version = "0.16", default-features = false, features = ["nalgebra"] }
ode_solvers = "0.6"
peroxide = { version = "0.43", default-features = false }

[[bench]]
name = "compare"
harness = false

# learned this from my goat zamazan4ik
[profile.release]
codegen-units = 1
lto = true
strip = true
